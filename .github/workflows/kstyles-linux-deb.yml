name: kstyles Linux deb
# Native x86_64 Linux build and verification of a labelled kstyles build (#17): the macOS
# package never compiles crates/ocr/src/paddle.rs, so Linux/Windows Korean recognition is
# untested there. This job builds the merged Korean craft-fonts input from pinned public refs,
# runs the PaddleOCR crate tests and a headless Korean roundtrip with the release CLI, then
# installs the .deb and repeats the roundtrip against /usr/bin and /usr/share/pdfcraft/models.
#
# Dispatch: gh workflow run kstyles-linux-deb.yml --ref feat/19.0-kstyles18 \
#   -f tag=v0.19.0-kstyles18 -f version=0.18.2 -f label=kstyles15
# `version` and `label` default to the release this branch ports; the label is what
# PDFCRAFT_BUILD_LABEL compiles into `--version` and what the assertions below expect.
#
# Debian/Ubuntu only (nfpm also writes a best-effort .rpm). The AppImage is deliberately left
# out: it needs appimagetool's FUSE/extract-and-run path and zsyncmake, which this recipe does
# not prove headlessly. Artifacts attach to $TAG with --clobber.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag the artifacts attach to"
        required: true
        default: v0.19.0-kstyles18
        type: string
      ref:
        description: "Branch or commit to build"
        required: true
        default: feat/19.0-kstyles18
        type: string
      version:
        description: "Release version the build reports (workspace [workspace.package] version)"
        required: true
        default: "0.19.0"
        type: string
      label:
        description: "Build label, compiled into --version and appended to the package release"
        required: true
        default: kstyles18
        type: string

permissions:
  contents: write

concurrency:
  group: kstyles-linux-deb-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  deb:
    # Native x86_64; matches the release gate's Linux runner. Note: a binary built here needs
    # glibc 2.39 (Ubuntu 24.04), so it runs on 24.04 and newer, not on older distros.
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
      VERSION: ${{ inputs.version }}
      LABEL: ${{ inputs.label }}
      # env.sh does NOT fold the label into $VERSION: --version becomes `0.18.0 (kstyles15)`
      # and package.sh's LABEL_SUFFIX puts -kstyles15 in every Linux file name. Do not also set
      # PDFCRAFT_VERSION=<version>-<label> here, or the label is appended twice.
      PDFCRAFT_BUILD_LABEL: ${{ inputs.label }}
      CRAFT_FONTS_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Rust 1.95 or newer
        run: |
          set -euo pipefail
          rustup update stable
          rustup default stable
          rustc --version
          version="$(rustc --version | awk '{print $2}')"
          if [ "$(printf '%s\n' 1.95 "$version" | sort -V | head -1)" != "1.95" ]; then
            echo "error: rustc $version is older than the workspace rust-version 1.95" >&2
            exit 1
          fi

      - name: Build dependencies and nfpm
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libgtk-3-dev libvulkan1 libegl1 jq
          # nfpm, as a pinned pre-built archive (the documented install options:
          # https://nfpm.goreleaser.com/docs/install/). Pinned so a new nfpm release cannot
          # change the package metadata under the same tag.
          curl --proto '=https' -fsSL -o "$RUNNER_TEMP/nfpm.tar.gz" \
            https://github.com/goreleaser/nfpm/releases/download/v2.48.0/nfpm_2.48.0_Linux_x86_64.tar.gz
          printf '%s  %s\n' \
            6d7f9a28b2f397934403950fcbba83f598b08d02edbe79a0815b3b4897341750 \
            "$RUNNER_TEMP/nfpm.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/nfpm.tar.gz" -C "$RUNNER_TEMP/bin" nfpm
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/nfpm" --version

      - name: Merged Korean craft-fonts input
        run: |
          set -euo pipefail
          chmod +x packaging/craft-fonts-korean-merge.sh
          packaging/craft-fonts-korean-merge.sh -o "$GITHUB_WORKSPACE/craft-fonts-korean"
          echo "CRAFT_FONTS_DIR=$GITHUB_WORKSPACE/craft-fonts-korean" >> "$GITHUB_ENV"

      - name: Merged Korean craft-i18n input
        run: |
          set -euo pipefail
          chmod +x packaging/craft-i18n-korean-merge.sh
          packaging/craft-i18n-korean-merge.sh -o "$GITHUB_WORKSPACE/craft-i18n-korean"
          echo "CRAFT_I18N_DIR=$GITHUB_WORKSPACE/craft-i18n-korean" >> "$GITHUB_ENV"

      - name: OCR models
        run: |
          set -euo pipefail
          cargo xtask models "$GITHUB_WORKSPACE/ocr-models"
          # The tests skip Korean when the models are missing; this must be the first search dir.
          echo "PDFCRAFT_MODELS=$GITHUB_WORKSPACE/ocr-models" >> "$GITHUB_ENV"

      - name: PaddleOCR tests (native Linux)
        run: |
          set -euo pipefail
          cargo test --release --locked -p pdfcraft-ocr -- --nocapture 2>&1 | tee ocr-test.log
          # A skip would leave the Linux/Windows OCR path untested while the job still passes.
          if grep -q 'skipped: Korean OCR models' ocr-test.log; then
            echo "error: the Korean OCR tests skipped; PDFCRAFT_MODELS did not reach them" >&2
            exit 1
          fi

      - name: Package deb, tar and cli
        run: |
          set -euo pipefail
          # One build; package.sh also stages the OCR models into the FHS tree.
          packaging/linux/package.sh --formats "deb tar cli"

      - name: RPM (best effort)
        run: |
          set -euo pipefail
          if packaging/linux/package.sh --skip-build --formats "rpm"; then
            echo "RPM_STATUS=built" >> "$GITHUB_ENV"
          else
            echo "::warning::nfpm could not build the .rpm; shipping deb, tar and cli only"
            echo "RPM_STATUS=skipped" >> "$GITHUB_ENV"
          fi

      - name: Headless Korean roundtrip, built and installed
        run: |
          set -euo pipefail
          # One page from the Korean fixture with the built CLI itself (doc_create from=images),
          # OCR it in Korean, save, then re-extract the text and require Hangul back.
          roundtrip() {
            local cli="$1" out="$2" work
            work="$(mktemp -d)"
            python3 -c 'import json,sys; f,o=sys.argv[1:3]; print(json.dumps([{"tool":"doc_create","args":{"from":"images","paths":[f],"dpi":200}},{"tool":"ocr_recognize","args":{"doc":1,"language":"ko"}},{"tool":"doc_save","args":{"doc":1,"path":o}}]))' \
              "$GITHUB_WORKSPACE/crates/ocr/tests/data/fixture-ko.png" "$out" > "$work/steps.json"
            "$cli" run --script "$work/steps.json" --report > "$work/report.json"
            if ! jq -e '.ok == true and .steps[1].status == "ok" and .steps[1].result[0].words >= 10' "$work/report.json" >/dev/null; then
              cat "$work/report.json" >&2
              echo "error: Korean OCR returned too few words" >&2
              return 1
            fi
            "$cli" text "$out" > "$work/text.txt"
            python3 -c 'import sys; t=open(sys.argv[1],encoding="utf-8").read(); h=[c for c in t if "\uac00" <= c <= "\ud7a3"]; assert "한국어" in t, repr(t); assert len(h) >= 20, len(h); print("Korean roundtrip ok:", len(h), "Hangul characters")' "$work/text.txt"
            rm -rf "$work"
          }

          roundtrip "$GITHUB_WORKSPACE/target/release/pdfcraft-cli" "$RUNNER_TEMP/roundtrip-built.pdf"

          deb="$(ls dist/release/pdfcraft-*-linux-x86_64.deb)"
          sudo dpkg -i "$deb"
          test -s /usr/share/pdfcraft/models/korean-recognition.onnx
          test -s /usr/share/pdfcraft/models/korean-dict.txt
          test "$(pdfcraft --version)" = "pdfcraft $VERSION ($LABEL)"
          if ! pdfcraft-cli --version | head -1 | grep -qxF "pdfcraft-cli $VERSION ($LABEL)"; then
            echo "error: installed pdfcraft-cli does not report $VERSION ($LABEL)" >&2
            exit 1
          fi
          # No PDFCRAFT_MODELS: the installed CLI must find /usr/share/pdfcraft/models itself.
          unset PDFCRAFT_MODELS
          roundtrip /usr/bin/pdfcraft-cli "$RUNNER_TEMP/roundtrip-installed.pdf"

      - name: Checksums, summary and release assets
        run: |
          set -euo pipefail
          shopt -s nullglob
          deb=(dist/release/pdfcraft-[0-9]*-linux-x86_64.deb)
          # [0-9] not *: pdfcraft-cli-<ver>-linux-x86_64.tar.gz would otherwise match too, and the
          # "exactly one FHS .tar.gz" assertion failed on the second hit.
          tar=(dist/release/pdfcraft-[0-9]*-linux-x86_64.tar.gz)
          cli=(dist/release/pdfcraft-cli-*-linux-x86_64.tar.gz)
          rpm=(dist/release/pdfcraft-[0-9]*-linux-x86_64.rpm)
          [ "${#deb[@]}" -eq 1 ] || { echo "error: expected exactly one .deb" >&2; exit 1; }
          [ "${#tar[@]}" -eq 1 ] || { echo "error: expected exactly one FHS .tar.gz" >&2; exit 1; }
          [ "${#cli[@]}" -eq 1 ] || { echo "error: expected exactly one CLI .tar.gz" >&2; exit 1; }
          artifacts=("${deb[@]}" "${tar[@]}" "${cli[@]}")
          if [ "${RPM_STATUS:-skipped}" = "built" ]; then
            [ "${#rpm[@]}" -eq 1 ] || { echo "error: RPM_STATUS=built but no .rpm was written" >&2; exit 1; }
            artifacts+=("${rpm[@]}")
          fi
          {
            echo "| artifact | bytes | sha256 |"
            echo "| --- | ---: | --- |"
            for f in "${artifacts[@]}"; do
              echo "| $(basename "$f") | $(stat -c%s "$f") | $(sha256sum "$f" | cut -d' ' -f1) |"
            done
            echo
            echo "- merged fonts: $(grep -cvE '^[[:space:]]*(#|$)' "$CRAFT_FONTS_DIR/fonts/manifest.txt") faces"
            echo "- AppImage: skipped (not proven headlessly)"
            echo "- RPM: ${RPM_STATUS:-skipped}"
          } >> "$GITHUB_STEP_SUMMARY"
          gh release upload "$TAG" "${artifacts[@]}" --clobber
          echo "::notice::attached ${#artifacts[@]} Linux artifacts to $TAG"
